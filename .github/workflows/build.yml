name: ZENTRIX CI
on:
  push:
    branches: [main, prep/storage-file-architecture]
  pull_request:
    branches: [main, prep/storage-file-architecture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and package UWP x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path $env:SystemDrive 'Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found." }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create temporary package signing certificate
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String "$([guid]::NewGuid().ToString('N'))" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=ZENTRIX" -KeyUsage DigitalSignature -FriendlyName "ZENTRIX CI Package Signing" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfxPath = Join-Path $env:RUNNER_TEMP "ZENTRIX-CI.pfx"
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "ZENTRIX-CI.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          "PACKAGE_CERTIFICATE=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_CERTIFICATE_PASSWORD=$([System.Net.NetworkCredential]::new('', $password).Password)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore and create signed Release x64 package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "AppPackages\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          & $env:MSBUILD_PATH .\ZENTRIX.sln /restore /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:AppxPackage=true /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$packageDir" /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:PACKAGE_CERTIFICATE" /p:PackageCertificatePassword="$env:PACKAGE_CERTIFICATE_PASSWORD" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Get-ChildItem -Path $packageDir -Recurse -File -Include *.msixbundle,*.appxbundle
          if (-not $bundle) { throw "Packaging completed without producing an MSIX/AppX bundle." }
          Copy-Item $bundle[0].FullName -Destination (Join-Path $packageDir "ZENTRIX-x64.msixbundle") -Force
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE "ZENTRIX-CI.cer"))) { throw "Signing certificate was not exported." }

      - name: Upload Xbox sideload package and certificate
        uses: actions/upload-artifact@v4
        with:
          name: ZENTRIX-Xbox-x64-Sideload
          path: |
            AppPackages/ZENTRIX-x64.msixbundle
            ZENTRIX-CI.cer
          if-no-files-found: error
          retention-days: 14
